name: release
# When a release is published, build the skill ZIP from the repository and attach it,
# so the download always matches the tagged files.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  skill-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the skill ZIP
        run: |
          cd plugins/hydroponic-for-black-thumbs/skills
          zip -r "$GITHUB_WORKSPACE/hydroponic-tower-coach.zip" hydroponic-tower-coach -x "*.DS_Store"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" hydroponic-tower-coach.zip --clobber
