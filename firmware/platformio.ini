; Hydroponic tower controller firmware
;   pio run                 build for the module version (default)
;   pio run -e pcb          build for the custom PCB
;   pio run -t upload       flash over USB
[platformio]
default_envs = modules

[env]
platform = espressif32@6.9.0     ; Arduino core 2.0.17, the version this code was compiled against
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/PaulStoffregen/OneWire.git#800f26f3ee6eb446a72e013785cac3700e54cc13
    https://github.com/milesburton/Arduino-Temperature-Control-Library.git#dadbbf7d33f500a5785ac4ae9973b8c9083d0d39

[env:modules]
build_flags = -Wall -DBOARD_MODULES

[env:pcb]
build_flags = -Wall -DBOARD_PCB
